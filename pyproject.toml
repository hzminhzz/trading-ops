[project]
name = "trading-ops"
version = "0.1.0"
description = "Private daily trading operations, wallet research, and strategy analysis workspace"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "copytrade-pm[market]",
    "duckdb>=1.2",
    "requests>=2.32",
]

[tool.uv.sources]
copytrade-pm = { git = "https://github.com/hzminhzz/copytrade-pm.git", rev = "e70bcdd4a750ad62905b2d7c571a04ca073682b1" }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
